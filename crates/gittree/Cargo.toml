[package]
name = "gittree"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "gittree"

[dependencies]
anyhow = "1"
dirs = "6"
gittree-core = { path = "../gittree-core" }
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-languages"] }
# Only the bench uses libc, to read peak memory.
libc = "0.2"
rust-i18n = "4.2"
smol = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
