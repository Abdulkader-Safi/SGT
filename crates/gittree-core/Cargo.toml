[package]
name = "gittree-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dirs = "6"
# The askpass token and folder name.
getrandom = "0.3"
# Only to signal a whole process group when a network command is cancelled.
libc = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
